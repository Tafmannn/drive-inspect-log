sonar.projectKey=axentra
sonar.organization=tafmannn
sonar.sources=src,supabase
# Source and colocated test files must be classified separately. Test code
# does not count as production new-code coverage or source lines.
sonar.tests=src,supabase/tests
sonar.test.inclusions=src/test/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,supabase/tests/**

# Exclude generated/boilerplate code from analysis and duplication detection.
# - src/integrations/supabase/types.ts: auto-generated by Supabase CLI
# - supabase/migrations/**: historical DB change files; must not be rewritten
# - supabase/rollback/**: paired .down.sql rollbacks for each migration; by
#   design they restore the prior CREATE OR REPLACE FUNCTION body, which is
#   near-identical to an earlier migration's version — inherent duplication,
#   not a code smell, and these files must not be rewritten either
# - supabase/functions/**: edge functions with unavoidable shared boilerplate (CORS, JWT)
# - supabase/staging-reconcile/**: staging-only reconciliation SQL copied verbatim
#   from the production catalogue (see docs/staging/STAGING-RECOVERY-REPORT.md);
#   never applied to production, sha256-pinned at apply time, must not be rewritten
# - Colocated *.test.ts(x) and *.spec.ts(x) files belong to sonar.tests,
#   never to production source coverage. sonar.test.inclusions automatically
#   excludes these paths from sonar.sources (SonarQube Cloud documented rule).
# - src/test/**: test fixtures and shared setup, never production code
sonar.exclusions=src/integrations/supabase/types.ts,supabase/migrations/**,supabase/staging-reconcile/**,supabase/rollback/**,supabase/functions/**,src/test/**,supabase/tests/**
sonar.cpd.exclusions=src/integrations/supabase/types.ts,supabase/migrations/**,supabase/staging-reconcile/**,supabase/rollback/**,supabase/functions/**,supabase/tests/**

# SQL scenario tests use repeatable UUIDs and fixture labels by design; they are
# classified as tests above. Suppress ONLY repeated-string-literal advice there,
# not security or runtime SQL findings, nor production SQL migrations.
sonar.issue.ignore.multicriteria=abortFixtures
sonar.issue.ignore.multicriteria.abortFixtures.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.abortFixtures.resourceKey=supabase/tests/**

# Coverage: generated by `vitest run --coverage` (see vitest.config.ts) before
# the scan step in .github/workflows/build.yml.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
