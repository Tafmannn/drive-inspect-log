sonar.projectKey=axentra
sonar.organization=tafmannn
sonar.sources=src,supabase
sonar.tests=src/test

# Exclude generated/boilerplate code from analysis and duplication detection.
# - src/integrations/supabase/types.ts: auto-generated by Supabase CLI
# - supabase/migrations/**: historical DB change files; must not be rewritten
# - supabase/rollback/**: paired .down.sql rollbacks for each migration; by
#   design they restore the prior CREATE OR REPLACE FUNCTION body, which is
#   near-identical to an earlier migration's version — inherent duplication,
#   not a code smell, and these files must not be rewritten either
# - supabase/functions/**: edge functions with unavoidable shared boilerplate (CORS, JWT)
# - src/test/**: already claimed by sonar.tests above; must be excluded from
#   sonar.sources too or the scanner fails with "can't be indexed twice"
#   (main-source and test-source sets must be disjoint)
sonar.exclusions=src/integrations/supabase/types.ts,supabase/migrations/**,supabase/rollback/**,supabase/functions/**,src/test/**
sonar.cpd.exclusions=src/integrations/supabase/types.ts,supabase/migrations/**,supabase/rollback/**,supabase/functions/**
