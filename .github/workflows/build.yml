name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test -- --coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          # Scanning successfully is not the same as passing the quality gate.
          # Fail CI if SonarQube reports insufficient coverage or reliability.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scanner's quality-gate summary gives a rating but not the actual
      # new-code issues. Report issue locations on a failed PR scan so
      # maintainers can fix the problem without weakening the gate.
      - name: Report new-code SonarQube issues on failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Sonar token not available; skip issue diagnostics."
            exit 0
          fi
          response="$(curl --fail --silent --show-error --max-time 30 \
            --user "$SONAR_TOKEN:" --get \
            --data-urlencode "componentKeys=axentra" \
            --data-urlencode "pullRequest=$SONAR_PR" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=100" \
            https://sonarcloud.io/api/issues/search)" || {
            echo "Unable to retrieve SonarQube issue details."
            exit 0
          }
          echo "$response" | jq -r '.issues[]? | "[\\(.severity)] \\(.rule) \\(.component):\\(.line // 0) — \\(.message)"'
